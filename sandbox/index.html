<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foto-Upload Sandbox</title><style>:root{font-family:system-ui;color:#2b2230;background:#fff7f0}*{box-sizing:border-box}body{margin:0}.demo{background:#ffe7a8;padding:9px;text-align:center;font-weight:700}main{max-width:720px;margin:auto;padding:28px 18px}h1{text-align:center;font-size:clamp(2rem,9vw,3.4rem)}.sub{text-align:center;color:#756b7a}.card{background:white;border-radius:24px;padding:24px;box-shadow:0 12px 35px #54203b18;margin:20px 0}.albums{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.album{border:0;border-radius:20px;padding:28px 10px;font:inherit;font-weight:800;color:white;background:linear-gradient(135deg,#ff5e8a,#ffb347)}.upload{display:block;text-align:center;border:2px dashed #ff8a72;border-radius:18px;padding:28px;cursor:pointer;font-weight:800}.msg{color:#218657;text-align:center;font-weight:700;min-height:1.5em}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo{aspect-ratio:1;border-radius:14px;background:linear-gradient(145deg,#ffd3df,#ffc273);display:grid;place-items:center;font-size:2rem}@media(max-width:430px){.albums{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="demo">Sandbox · keine Datei wird hochgeladen oder gespeichert</div><main><h1>Fotos gemeinsam sammeln</h1><p class="sub">So sieht Foto‑Upload für deine Gäste aus.</p><section class="card"><h2>Album wählen</h2><div class="albums"><button class="album">🎉 Franz 70</button><button class="album">🏖️ Urlaub Family</button></div></section><section class="card"><label class="upload">📸 Fotos &amp; Videos auswählen<input id="files" type="file" multiple hidden></label><p id="msg" class="msg"></p></section><section class="card"><h2>Beispielgalerie</h2><div class="gallery"><div class="photo">🎂</div><div class="photo">🥳</div><div class="photo">🌅</div><div class="photo">🏖️</div><div class="photo">📷</div><div class="photo">🎬</div></div></section></main><script>files.onchange=()=>{msg.textContent=files.files.length?`${files.files.length} Datei(en) ausgewählt – in dieser Demo wird nichts hochgeladen.`:'';files.value=''}</script></body></html>

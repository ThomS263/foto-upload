<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173c34">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Foto-Upload{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="manifest" href="{{ url_for('pages.manifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script defer src="{{ url_for('static', filename='base.js') }}"></script>
  <script defer src="{{ url_for('static', filename='i18n.js') }}"></script>
  {% block scripts %}{% endblock %}
</head>
<body>
<a class="skip" href="#inhalt">Zum Inhalt</a>
<header class="top"><nav aria-label="Hauptnavigation" class="wrap">
  <a class="brand" href="{{ url_for('pages.home') }}"><span class="mark" aria-hidden="true"><i></i></span>Foto-Upload</a>
  <span class="nav-actions"><label class="language"><span>Sprache</span><select id="language" aria-label="Sprache"><option value="de">DE</option><option value="en">EN</option></select></label>
  <a class="navlink" href="{{ url_for('admin.panel') }}">Verwaltung</a></span>
</nav></header>
<main id="inhalt" class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
